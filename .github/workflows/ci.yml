name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x scripts/*.sh && shellcheck -s bash -e SC2034 armbian/extensions/*.sh
      - name: check-mi50.sh against fake sysfs trees
        run: ./tests/test-check-mi50.sh
      - name: arm-cpu.sh against fake cpuinfo trees
        run: ./tests/test-arm-cpu.sh
      - name: cpu-threads-bench.sh with a stand-in llama-bench
        run: ./tests/test-cpu-threads-bench.sh
      - name: gpu-parity.sh with a stand-in test-backend-ops
        run: ./tests/test-gpu-parity.sh
      - name: MI50 Armbian image integration static checks
        run: python3 tests/test-mi50-armbian-image.py
      - name: MI50 Resolute preparation fixture and repeat-run test
        run: python3 tests/test-mi50-resolute-prepare.py
      - name: MI50 Resolute rebuild workflow policy checks
        run: python3 tests/test-mi50-resolute-ci.py
      - name: shellcheck MI50 Armbian image integration
        run: >-
          shellcheck -x armbian/image/*.sh
          armbian/image/overlay/mi50-customize-image.sh
          armbian/image/overlay/mi50-customize-image-resolute.sh
          armbian/image/overlay/usr/local/sbin/mi50-*
          tests/fixtures/mi50-resolute/run-customizer-inside-resolute.sh
      - name: kernel patch applies to supported kernels
        run: |
          for tag in v6.12 v6.18 v7.3 master; do
            d=$(mktemp -d); mkdir -p "$d/drivers/gpu/drm/amd/amdgpu"
            curl -sSfL "https://raw.githubusercontent.com/torvalds/linux/$tag/drivers/gpu/drm/amd/amdgpu/amdgpu_ttm.c" \
              -o "$d/drivers/gpu/drm/amd/amdgpu/amdgpu_ttm.c"
            (cd "$d" && patch -p1 --dry-run < "$GITHUB_WORKSPACE"/patches/0001-drm-amdgpu-use-write-combined-GTT-on-non-coherent-hosts.patch) || { echo "does not apply to $tag"; exit 1; }
            echo "applies to $tag"
          done

  resolute-arm64-customizer:
    name: Execute image customizer on Ubuntu Resolute ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run core payload customizer in a native ARM64 Resolute container
        run: tests/test-mi50-resolute-customizer.sh
